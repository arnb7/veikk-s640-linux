# VEIKK S640 Linux Userspace Driver Configuration
# Default system location: /etc/veikk-s640/config.toml
# User override: ~/.config/veikk-s640/config.toml

[tablet]
# Button Mode:
#   "remapper" (default): Physical barrel buttons are emitted ONLY to the
#                         "VEIKK S640 Buttons" virtual device (as BTN_0, BTN_1, BTN_2).
#                         They are never emitted to the Pen device, preventing double events
#                         and letting input-remapper remap buttons cleanly.
#   "native":             Physical barrel buttons are emitted to "VEIKK S640 Pen"
#                         as standard stylus buttons (BTN_STYLUS, BTN_STYLUS2).
button_mode = "remapper"

# Orientation in degrees: 0, 90, 180, 270 (useful for left-handed orientation)
orientation = 0

# Coordinate width in bytes: 1, 2, or 3 (default 3 for S640/T10 5080 LPI range)
coord_width = 3

# Hardware bounds confirmed from string descriptor 0x14 on hardware (5080 LPI = 200 units/mm):
max_x = 30480
max_y = 20320
max_pressure = 8191

[smoothing]
# Anti-jitter & adaptive motion filter:
#   enable: true enables the filter; false passes raw coordinates.
#   factor: 0.0 (raw/off) to 1.0 (heavy smoothing). 0.40 - 0.50 gives silky smooth tracking.
#   deadzone: raw units (typically 3-6) to suppress ADC hand tremor when hovering still.
#   pressure_smoothing: 0.0 to 1.0 smooths pressure transitions for drawing lines.
enable = true
factor = 0.45
deadzone = 4
pressure_smoothing = 0.30

[motion]
# Motion & Hover distance scaling:
#   hover_scale: 0.10 to 2.00 (default 1.0 = 1:1 screen mapping).
#                Lower values (e.g. 0.50 - 0.75) scale down cursor travel distance
#                relative to physical pen movement, eliminating exaggerated cursor jumps during hover.
#   contact_scale: 0.10 to 2.00 (distance scale when pen tip is touching).
#   lock_scales: true keeps contact_scale synchronized with hover_scale for seamless stroke continuity.
hover_scale = 1.00
contact_scale = 1.00
lock_scales = true

[buttons]
# Stylus barrel button remapping (in-app input-remapper presets)
# button1_action: "mouse:btn_right", "pan_scroll", "mouse:btn_middle", "keyboard:Control_L + z", etc.
button1_action = "mouse:btn_right"
button2_action = "pan_scroll"
button1_custom = ""
button2_custom = ""
autoload = true

[scroll]
# Pan / Scroll settings when holding a barrel button:
#   sensitivity: 0.20 to 3.00 (default 1.0 = ~1.5mm movement per scroll tick).
#   natural: false = standard PC wheel-down when gliding down; true = touchscreen/macOS inverted.
sensitivity = 1.00
natural = false

[area]
# Active area crop ratios (0.0 to 1.0)
min_x = 0.0
max_x = 1.0
min_y = 0.0
max_y = 1.0

[pressure]
# Pressure response curve: "linear" or "gamma"
curve = "linear"

# Gamma value if curve is "gamma": < 1.0 makes pen more sensitive; > 1.0 firmer feel
gamma = 1.0

# Minimum pressure threshold before registering stroke contact
threshold = 0
